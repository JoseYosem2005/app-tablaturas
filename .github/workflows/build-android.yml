name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Add storage permissions to AndroidManifest.xml
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          echo "--- Manifest antes del parche ---"
          cat "$MANIFEST"

          # Permisos de almacenamiento:
          #  - READ/WRITE clasicos, limitados a Android <=10/9 via maxSdkVersion
          #  - MANAGE_EXTERNAL_STORAGE para Android 11+ (se activa a mano en Ajustes)
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />\n</manifest>#' "$MANIFEST"

          # requestLegacyExternalStorage: solo tiene efecto en Android <=10,
          # Android 11+ lo ignora sin problema.
          sed -i 's#<application#<application\n        android:requestLegacyExternalStorage="true"#' "$MANIFEST"

          echo "--- Manifest despues del parche ---"
          cat "$MANIFEST"

      - name: Sync web assets
        run: npx cap sync android

      - name: Generate app icons from assets/icon.svg
        run: npx capacitor-assets generate --android

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tab-finder-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

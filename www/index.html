<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Tab Finder</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="topbar">
    <span class="brand">Tab Finder</span>
    <span class="spacer"></span>
    <button id="settingsBtn" class="btn-icon" aria-label="Configuracion">⚙</button>
  </header>

  <section class="search-panel">
    <label class="field-label">ARTISTA</label>
    <input id="artist" type="text" placeholder="Ej: Metallica, Soda Stereo…" autocomplete="off" />

    <label class="field-label">CANCION</label>
    <input id="song" type="text" placeholder="Ej: Enter Sandman, De Musica Ligera…" autocomplete="off" />

    <button id="searchBtn" class="btn-accent">BUSCAR TABLATURA</button>
  </section>

  <div id="count" class="count-label"></div>

  <main id="results" class="results"></main>

  <footer id="status" class="status-bar"></footer>

  <!-- Panel de configuracion -->
  <div id="settingsOverlay" class="overlay hidden">
    <div class="settings-panel">
      <div class="settings-header">
        <span>Configuracion</span>
        <button id="settingsClose" class="btn-icon" aria-label="Cerrar">✕</button>
      </div>

      <label class="field-label">CARPETA DE DESCARGA</label>
      <select id="dirSelect">
        <option value="EXTERNAL_STORAGE">Externo (visible en exploradores de archivos)</option>
        <option value="DOCUMENTS">Documentos (privado de la app)</option>
        <option value="CACHE">Cache (temporal, privado)</option>
      </select>
      <p class="settings-hint">
        "Externo" es lo mas facil de encontrar despues con otra app (por ejemplo,
        para abrir el archivo con una app de Guitar Pro). No requiere permisos
        adicionales: es una carpeta propia de Tab Finder dentro del almacenamiento
        del telefono.
      </p>

      <button id="settingsSave" class="btn-accent">Guardar</button>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>

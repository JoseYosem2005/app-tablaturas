<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Tab Finder</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="topbar">
    <span class="brand">Tab Finder</span>
  </header>

  <section class="search-panel">
    <label class="field-label">ARTISTA</label>
    <input id="artist" type="text" placeholder="Ej: Metallica, Soda Stereo…" autocomplete="off" />

    <label class="field-label">CANCION</label>
    <input id="song" type="text" placeholder="Ej: Enter Sandman, De Musica Ligera…" autocomplete="off" />

    <button id="searchBtn" class="btn-accent">BUSCAR TABLATURA</button>
  </section>

  <div id="count" class="count-label"></div>

  <main id="results" class="results"></main>

  <footer id="status" class="status-bar"></footer>

  <script src="js/app.js"></script>
</body>
</html>
